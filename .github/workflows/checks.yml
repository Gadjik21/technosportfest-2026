name: Checks

on:
  push:
  pull_request:

jobs:
  contract-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python tools/check_contract.py
      - run: pip install -e '.[dev]'
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make up
      - run: curl --fail-with-body --silent --show-error http://localhost:8080/health
      - run: curl --fail-with-body --silent --show-error http://localhost:8080/api/v1/disciplines
      - run: curl --fail-with-body --silent --show-error http://localhost:8080/ -o /dev/null
      - if: always()
        run: docker compose logs --tail=100 && make down
